services:
  traefik:
    container_name: traefik
    image: docker.io/library/traefik:v3
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/brad/homelab/traefik-data:/data
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/data/acme.json
    networks:
      - nextcloud
    restart: unless-stopped

  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - /home/brad/homelab/hass-config:/config:Z
      - /etc/localtime:/etc/localtime:ro
    # For initial setup, host networking lets HA auto-discover local smart devices effortlessly
    network_mode: host
    restart: unless-stopped

  redis:
    container_name: nextcloud-redis
    image: docker.io/library/redis:alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - nextcloud
    restart: unless-stopped

  mariadb:
    container_name: nextcloud-db
    image: docker.io/library/mariadb:lts
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - /home/brad/homelab/nextcloud-db:/var/lib/mysql:Z
    networks:
      - nextcloud
    restart: unless-stopped

  collabora:
    container_name: collabora
    image: collabora/code:latest
    environment:
      - aliasgroup1=https://${NEXTCLOUD_DOMAIN}
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true
    networks:
      - nextcloud
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.collabora.rule=Host(`${COLLABORA_DOMAIN}`)"
      - "traefik.http.routers.collabora.entrypoints=websecure"
      - "traefik.http.routers.collabora.tls.certresolver=letsencrypt"
      - "traefik.http.services.collabora.loadbalancer.server.port=9980"
    restart: unless-stopped

  nextcloud:
    container_name: nextcloud-app
    image: docker.io/library/nextcloud:33
    environment:
      MYSQL_HOST: mariadb
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_DOMAIN}
      TRUSTED_PROXIES: 172.18.0.0/16
      OVERWRITEHOST: ${NEXTCLOUD_DOMAIN}
      OVERWRITEPROTOCOL: https
      PHP_UPLOAD_LIMIT: 10G
      PHP_MEMORY_LIMIT: 512M
    volumes:
      - /home/brad/homelab/nextcloud-config:/var/www/html:Z
      - /home/brad/homelab/nextcloud-data:/var/www/html/data:Z
    networks:
      - nextcloud
    depends_on:
      - mariadb
      - traefik
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`${NEXTCLOUD_DOMAIN}`)"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.tls.certresolver=letsencrypt"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
      - "traefik.http.routers.nextcloud.middlewares=nextcloud-headers,nextcloud-caldav"
      # Security headers
      - "traefik.http.middlewares.nextcloud-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.nextcloud-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.nextcloud-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.nextcloud-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.nextcloud-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.nextcloud-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.nextcloud-headers.headers.referrerPolicy=no-referrer"
      - "traefik.http.middlewares.nextcloud-headers.headers.customResponseHeaders.X-Frame-Options=SAMEORIGIN"
      # .well-known redirects for CalDAV/CardDAV
      - "traefik.http.middlewares.nextcloud-caldav.redirectregex.permanent=true"
      - "traefik.http.middlewares.nextcloud-caldav.redirectregex.regex=^https://(.*)/.well-known/ca(l|rd)dav"
      - "traefik.http.middlewares.nextcloud-caldav.redirectregex.replacement=https://$${1}/remote.php/dav/"
    restart: unless-stopped

  wanderer-search:
    container_name: wanderer-search
    image: getmeili/meilisearch:v1.36.0
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - /home/brad/homelab/wanderer-search:/meili_data/data.ms:Z
    networks:
      - nextcloud
    restart: unless-stopped
    healthcheck:
      test: curl --fail http://localhost:7700/health || exit 1
      interval: 15s
      retries: 10
      start_period: 20s
      timeout: 10s

  wanderer-db:
    container_name: wanderer-db
    image: flomp/wanderer-db
    depends_on:
      wanderer-search:
        condition: service_healthy
    environment:
      MEILI_URL: http://wanderer-search:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      POCKETBASE_ENCRYPTION_KEY: ${POCKETBASE_ENCRYPTION_KEY}
      ORIGIN: https://${WANDERER_DOMAIN}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - /home/brad/homelab/wanderer-db:/pb_data:Z
    networks:
      - nextcloud
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/curl", "--fail", "http://localhost:8090/health"]
      interval: 15s
      retries: 10
      start_period: 20s
      timeout: 10s

  wanderer:
    container_name: wanderer
    image: flomp/wanderer-web
    depends_on:
      wanderer-search:
        condition: service_healthy
      wanderer-db:
        condition: service_healthy
    environment:
      MEILI_URL: http://wanderer-search:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      ORIGIN: https://${WANDERER_DOMAIN}
      BODY_SIZE_LIMIT: Infinity
      PUBLIC_POCKETBASE_URL: http://wanderer-db:8090
      PUBLIC_DISABLE_SIGNUP: "true"
      UPLOAD_FOLDER: /app/uploads
      OVERPASS_API_URL: https://overpass-api.de
      VALHALLA_URL: https://valhalla1.openstreetmap.de
      NOMINATIM_URL: https://nominatim.openstreetmap.org
    volumes:
      - /home/brad/homelab/wanderer-uploads:/app/uploads:Z
      - /home/brad/homelab/wanderer-branding:/wanderer-branding:ro
    # Re-brand the stock Wanderer landing/UI to "Brad's Trails" on every start
    # (patches the built JS before the node server reads it). Survives restarts
    # and re-applies automatically after a Wanderer image update.
    command: ["sh", "-c", "/wanderer-branding/patch-branding.sh; exec npm run start"]
    networks:
      - nextcloud
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wanderer.rule=Host(`${WANDERER_DOMAIN}`)"
      - "traefik.http.routers.wanderer.entrypoints=websecure"
      - "traefik.http.routers.wanderer.tls.certresolver=letsencrypt"
      - "traefik.http.routers.wanderer.middlewares=wanderer-headers@docker"
      - "traefik.http.services.wanderer.loadbalancer.server.port=3000"
      # Wanderer-specific headers — referrer policy must allow cross-origin so
      # Messenger's l.facebook.com redirect service can follow the link.
      - "traefik.http.middlewares.wanderer-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.wanderer-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.wanderer-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.wanderer-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.wanderer-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.wanderer-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.wanderer-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.wanderer-headers.headers.customResponseHeaders.X-Frame-Options=SAMEORIGIN"
      # We rebrand by editing the built JS/CSS/image assets in place (same
      # hashed filenames). Wanderer serves those as `immutable` for a year, so
      # browsers would never pick up our edits. Override to force revalidation
      # (cheap 304s via etag) so in-place changes propagate to returning visitors.
      - "traefik.http.middlewares.wanderer-headers.headers.customResponseHeaders.Cache-Control=no-cache"
    restart: unless-stopped

networks:
  nextcloud:
    ipam:
      config:
        - subnet: 172.18.0.0/16
